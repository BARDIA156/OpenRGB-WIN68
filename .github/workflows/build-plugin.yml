name: Build AULA WIN68 HE plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "plugin/**"
      - "scripts/**"
      - "layout/**"
      - ".github/workflows/build-plugin.yml"

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate vendor keymap and native OpenRGB matrix
        shell: pwsh
        run: |
          python scripts/generate_keymap.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated keymap is stale' }
          python scripts/check_layout.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WIN68 matrix is invalid' }
      - name: Fetch matching OpenRGB headers and HID library
        shell: pwsh
        run: git clone --depth 1 --branch release_1.0 https://github.com/CalcProgrammer1/OpenRGB.git openrgb-source
      - name: Install Qt for MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC toolchain not found' }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & ./scripts/build-plugin.ps1 -OpenRGBSource (Join-Path $env:GITHUB_WORKSPACE 'openrgb-source') -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist')
          Write-Host '--- dist manifest ---'
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist') -File | Select-Object Name,Length
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'dist\OpenRGB-WIN68.dll'))) { throw 'Plugin DLL missing from dist' }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-WIN68-1.0.0-OpenRGB-1.0-windows-x64
          path: |
            dist/*.dll
          if-no-files-found: error
