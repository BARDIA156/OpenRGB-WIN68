name: Build OpenRGB-WIN68 plugin
on:
  workflow_dispatch:
  push:
    paths:
      - "plugin-source-new.zip"
      - "plugin-source.zip"
      - ".github/workflows/build-plugin.yml"

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4

      - name: Select and extract plugin source
        shell: pwsh
        run: |
          $archive = if (Test-Path plugin-source-new.zip) { "plugin-source-new.zip" } elseif (Test-Path plugin-source.zip) { "plugin-source.zip" } else { $null }
          if (-not $archive) { throw "No plugin source archive found" }
          Expand-Archive -LiteralPath $archive -DestinationPath extracted-plugin -Force
          $script = Get-ChildItem extracted-plugin -Recurse -Filter build-plugin.ps1 -File | Select-Object -First 1
          if (-not $script) { throw "build-plugin.ps1 was not found inside the source archive" }
          "PLUGIN_ROOT=$($script.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Plugin root: $($script.Directory.Parent.FullName)"

      - name: Fetch matching OpenRGB source
        shell: pwsh
        run: git clone --depth 1 --branch release_1.0 https://github.com/CalcProgrammer1/OpenRGB.git openrgb-source

      - name: Install Qt for MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64

      - name: Build and stage exact runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw "C++ toolset was not found" }
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item dist -ItemType Directory | Out-Null
          & "$env:PLUGIN_ROOT\scripts\build-plugin.ps1" -OpenRGBSource "$PWD\openrgb-source" -OutputDirectory "$PWD\dist"
          if (-not (Test-Path "$PWD\dist\OpenRGB-WIN68.dll") -and (Test-Path "$PWD\dist\OpenRGBAulaHE.dll")) { Move-Item "$PWD\dist\OpenRGBAulaHE.dll" "$PWD\dist\OpenRGB-WIN68.dll" }
          $plugin = Get-Item "$PWD\dist\OpenRGB-WIN68.dll" -ErrorAction Stop
          $hid = Get-Item "$PWD\dist\hidapi-hotplug.dll" -ErrorAction Stop
          if ($plugin.Length -gt 2MB) { throw "Plugin DLL is unexpectedly large: $($plugin.Length) bytes" }
          if ($hid.Length -gt 10MB) { throw "HID runtime DLL is unexpectedly large: $($hid.Length) bytes" }
          Write-Host "--- exact artifact manifest ---"
          Get-ChildItem dist -File | Select-Object Name,Length
          "PLUGIN_BYTES=$($plugin.Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HID_BYTES=$($hid.Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload only the two runtime DLLs
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-WIN68-1.0.0-OpenRGB-1.0-windows-x64
          path: |
            dist/OpenRGB-WIN68.dll
            dist/hidapi-hotplug.dll
          if-no-files-found: error
